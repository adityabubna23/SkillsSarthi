[package]
name = "skillsathi-backend"
version = "0.1.0"
edition = "2021"
description = "SkillSathi AI — Rust backend for AI-powered career companion"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (for DigitalOcean AI + Backboard APIs)
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Error handling
thiserror = "2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Environment variables
dotenvy = "0.15"

# UUID generation (for request IDs, candidate IDs)
uuid = { version = "1", features = ["v4"] }

# PDF text extraction
pdf-extract = "0.7"

[dev-dependencies]
tokio-test = "0.4"
